name: Build

# 推送到 main / 打 tag 时自动构建；也可以在 Actions 页面手动触发。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一个分支连续推送时，取消上一次还在跑的构建，省 CI 额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # 降低 Rust 编译并发，避免 7GB 内存的 runner 被 OOM 杀掉（Tauri 的 LTO 很吃内存）
  CARGO_BUILD_JOBS: "3"

jobs:
  # ---------------------------------------------------------------------------
  # Windows：出免安装 exe + NSIS 安装包
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      # 缓存 ~/.cargo/registry、~/.cargo/git 与 src-tauri/target，
      # 并用 Cargo.lock 做 key，依赖没变就直接复用上次的编译产物。
      - name: 缓存 Rust 依赖与产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-x64
          cache-on-failure: true

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建（release + NSIS 安装包）
        run: pnpm tauri:build

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          Copy-Item src-tauri/target/release/gpt-image-studio.exe dist-artifacts/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist-artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem dist-artifacts | Format-Table Name, Length

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: gpt-image-studio-windows-x64
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Android：按 ABI 矩阵并行出 APK
  #
  # 为什么拆成矩阵而不是一个 job 编全部 ABI：
  #   1) 每个 job 独立磁盘，避免 4 个 ABI 的 target 目录撑爆 runner 空间；
  #   2) 并行跑，墙钟时间短得多；
  #   3) 某个 ABI 失败不会连累其它 ABI（fail-fast: false）。
  # ---------------------------------------------------------------------------
  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            abi: arm64-v8a
          - target: armv7
            abi: armeabi-v7a
          - target: x86_64
            abi: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android：它在 ubuntu-24.04 镜像上会去安装上游
      # 已移除的旧版 `tools` 包，sdkmanager 直接退出码 1 把整个 job 打断。
      # GitHub 的 ubuntu 镜像本来就预装了完整 SDK（/usr/local/lib/android/sdk），
      # 这里只做「探测 + 补齐 NDK + 导出环境变量」。
      - name: 准备 Android SDK 与 NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK 目录："; ls "$ANDROID_HOME"

          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$SDKMANAGER" ]; then
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
            echo "sdkmanager: $SDKMANAGER"
          else
            echo "::warning::没找到 cmdline-tools 里的 sdkmanager"
          fi

          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK_DIR" ]; then
            echo "镜像未预装 NDK，安装 27.0.12077973"
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
              "$SDKMANAGER" --install "ndk;27.0.12077973" || true
            fi
            NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          if [ ! -d "$NDK_DIR" ]; then
            echo "::error::NDK 不可用：$NDK_DIR"
            exit 1
          fi
          echo "使用 NDK：$NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

          # apksigner / zipalign 在 build-tools 里，后置签名要用
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          echo "build-tools: ${BUILD_TOOLS:-未找到}"
          ls "${BUILD_TOOLS:-/nonexistent}" 2>/dev/null | grep -E "^(apksigner|zipalign)" || true

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust 与 Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: 缓存 Rust 依赖与产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # 每个 ABI 单独一份缓存，避免互相覆盖
          key: android-${{ matrix.target }}
          cache-on-failure: true

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/tauri.conf.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 快速单元测试：AndroidManifest 补丁逻辑。
      # 这段逻辑曾把字面量（反引号+n）写进 XML，导致 Gradle 的
      # processUniversalReleaseMainManifest 阶段解析失败，所以固定在构建前跑。
      - name: 校验 AndroidManifest 补丁逻辑
        shell: pwsh
        run: pwsh -File scripts/test-android-manifest.ps1

      # 准备签名材料。没配 secrets 就生成一把一次性 keystore，
      # 保证产物可安装（代价是每次构建签名不同、无法覆盖安装）。
      - name: 准备签名 keystore
        shell: pwsh
        env:
          SECRET_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $ksAlias = if ($env:SECRET_KEY_ALIAS) { $env:SECRET_KEY_ALIAS } else { "ci-upload" }
          $ksPass  = if ($env:SECRET_KEY_PASSWORD) { $env:SECRET_KEY_PASSWORD } else { "android" }
          $tmp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [IO.Path]::GetTempPath() }

          if ($env:SECRET_KEY_BASE64) {
            Write-Host "使用仓库 secrets 中配置的 keystore"
            $ks = Join-Path $tmp "upload.jks"
            [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:SECRET_KEY_BASE64))
          } else {
            Write-Host "::warning::未配置 ANDROID_KEY_BASE64，改用一次性 CI keystore；每次构建签名都不同，无法覆盖安装。"
            $ks = Join-Path $tmp "ci-upload.jks"
            & "$env:JAVA_HOME/bin/keytool" -genkeypair -v -keystore $ks -alias $ksAlias `
              -keyalg RSA -keysize 2048 -validity 10000 `
              -storepass $ksPass -keypass $ksPass `
              -dname "CN=CI, OU=CI, O=GPT Image Studio, L=CI, S=CI, C=CN"
            if ($LASTEXITCODE -ne 0) { throw "keytool 生成 keystore 失败" }
          }
          if (-not (Test-Path $ks)) { throw "keystore 未生成：$ks" }
          Write-Host "keystore: $ks"

          foreach ($pair in @(@("ANDROID_KS_PATH", $ks), @("ANDROID_KS_ALIAS", $ksAlias), @("ANDROID_KS_PASSWORD", $ksPass))) {
            [IO.File]::AppendAllText($env:GITHUB_ENV, "$($pair[0])=$($pair[1])`n")
          }

      # 复用仓库里的脚本：init 工程 + 注入明文流量放行。
      # GitHub runner 自带 pwsh，所以 Windows/Linux 用同一份逻辑。
      - name: 配置 Android 工程
        shell: pwsh
        run: pwsh -File scripts/setup-android.ps1 -CleartextHosts 10.213.196.114,localhost,10.0.2.2

      - name: 构建 APK
        # --ci：跳过交互式提问（签名等），否则 runner 上会卡住等输入
        run: pnpm tauri android build --apk --ci --target ${{ matrix.target }}

      - name: 诊断信息（仅构建失败时）
        if: failure()
        run: |
          find src-tauri/gen/android/app/build/outputs -name "*.apk" 2>/dev/null || echo "没有产生任何 APK"
          echo "--- tauri android build 支持的参数 ---"
          if command -v pnpm > /dev/null; then
            pnpm tauri android build --help || true
          else
            echo "(pnpm 尚未安装，跳过)"
          fi

      # Tauri 的 Gradle 模板没有配 signingConfig，产出的 release APK 是未签名的，
      # 无法直接安装。这里用 apksigner 做后置签名：与 Gradle 模板结构无关，稳定得多。
      - name: 签名 APK（zipalign + apksigner）
        shell: pwsh
        run: |
          pwsh -File scripts/sign-android-apk.ps1 `
            -KeystorePath $env:ANDROID_KS_PATH `
            -KeyAlias $env:ANDROID_KS_ALIAS `
            -KeyPassword $env:ANDROID_KS_PASSWORD

      - name: 列出最终产物
        run: find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: gpt-image-studio-android-${{ matrix.abi }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
